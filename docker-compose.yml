services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pr_review_db
    environment:
      POSTGRES_USER: pr_review
      POSTGRES_PASSWORD: pr_review_pass
      POSTGRES_DB: pr_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: